[alias]
m0-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware"
m0-run = "run --locked --release --target thumbv7m-none-eabi -p anova-firmware"

m1-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m1"
m1-hse-fallback-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m1-fault-hse"
m1-pll-fallback-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m1-fault-pll"
m1-switch-fallback-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m1-fault-switch"
m1-panic-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m1-panic"

m2-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2"
m2-run = "run --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2"
m2-test-nvic-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2-test-nvic"
m2-test-critical-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2-test-critical"
m2-test-svc-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2-test-svc"
m2-test-wrap-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2-test-wrap"
m2-fault-usage-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2-fault-usage"
m2-fault-bus-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2-fault-bus"
m2-fault-hard-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2-fault-hard"
m2-fault-irq-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2-fault-irq"
m2-fault-silent-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m2-fault-silent"

m3-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features heap-tlsf --target-dir target/m3"
m3-run = "run --locked --release --target thumbv7m-none-eabi -p anova-firmware --features heap-tlsf --target-dir target/m3"
m3-no-heap-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m3 --target-dir target/m3-no-heap"
m3-test-pool-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m3-test-pool --target-dir target/m3-test-pool"
m3-test-tlsf-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m3-test-tlsf --target-dir target/m3-test-tlsf"
m3-test-alignment-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m3-test-alignment --target-dir target/m3-test-alignment"
m3-test-fragmentation-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m3-test-fragmentation --target-dir target/m3-test-fragmentation"
m3-test-oom-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m3-test-oom --target-dir target/m3-test-oom"
m3-test-stack-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m3-test-stack --target-dir target/m3-test-stack"
m3-test-corruption-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m3-test-corruption --target-dir target/m3-test-corruption"
m3-test-performance-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m3-test-performance --target-dir target/m3-test-performance"

m4-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m4,heap-tlsf --target-dir target/m4"
m4-run = "run --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m4,heap-tlsf --target-dir target/m4"
m4-no-heap-build = "build --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m4 --target-dir target/m4-no-heap"
m4-no-heap-run = "run --locked --release --target thumbv7m-none-eabi -p anova-firmware --features m4 --target-dir target/m4-no-heap"

[target.thumbv7m-none-eabi]
runner = [
    "probe-rs",
    "run",
    "--chip", "STM32F103ZETx",
    "--protocol", "swd",
    "--verify",
    "--no-catch-reset"
]