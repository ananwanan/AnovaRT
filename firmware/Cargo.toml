[package]
name = "anova-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
m1 = ["dep:anova-kernel"]
m1-fault-hse = ["m1"]
m1-fault-pll = ["m1"]
m1-fault-switch = ["m1"]
m1-panic = ["m1"]
confirmed-hse-8mhz = ["anova-board/confirmed-hse-8mhz"]
confirmed-usart1 = ["anova-board/confirmed-usart1"]
log-debug = ["m1", "anova-kernel/log-debug"]
log-trace = ["m1", "anova-kernel/log-trace"]

[[bin]]
name = "anova-firmware"
path = "src/main.rs"
test = false
bench = false

[target.thumbv7m-none-eabi.dependencies]
anova-cortex-m = { path = "../arch/cortex-m" }
anova-board = { path = "../bsp/threebluewhale-f103ze" }
anova-kernel = { path = "../kernel", optional = true }
