[package]
name = "anova-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
m2 = ["m1", "anova-cortex-m/m2"]
m2-test-nvic = ["m2"]
m2-test-critical = ["m2"]
m2-test-svc = ["m2"]
m2-test-wrap = ["m2"]
m2-fault-usage = ["m2"]
m2-fault-bus = ["m2"]
m2-fault-hard = ["m2"]
m2-fault-irq = ["m2"]
m2-fault-silent = ["m2"]
m1 = ["dep:anova-kernel"]
m1-fault-hse = ["m1"]
m1-fault-pll = ["m1"]
m1-fault-switch = ["m1"]
m1-panic = ["m1"]
confirmed-hse-8mhz = ["anova-board/confirmed-hse-8mhz"]
confirmed-usart1 = ["anova-board/confirmed-usart1"]
log-debug = ["m1", "anova-kernel/log-debug"]
log-trace = ["m1", "anova-kernel/log-trace"]

[[bin]]
name = "anova-firmware"
path = "src/main.rs"
test = false
bench = false

[target.thumbv7m-none-eabi.dependencies]
anova-cortex-m = { path = "../arch/cortex-m" }
anova-board = { path = "../bsp/threebluewhale-f103ze" }
anova-kernel = { path = "../kernel", optional = true }
